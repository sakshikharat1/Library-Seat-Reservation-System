<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Seat Reservation</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14262b;--mute:#5b6b6f;--line:#d5dddc;--acc:#1b6b5a;--acc-ink:#fff;--free:#e3f1ec;--taken:#d9dee0;--mine:#f2c14e;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b1e;--card:#162428;--ink:#e6efee;--mute:#92a5a8;--line:#2a3d41;--acc:#4fc1a6;--acc-ink:#07201a;--free:#1d3a35;--taken:#2a363a;--mine:#d9a82f;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:600;margin:0 0 .5rem}
h1{font-size:1.7rem}h2{font-size:1.3rem}h3{font-size:1.05rem}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
button,input,select{font:inherit;color:inherit}
button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--mine);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 140px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.zone{margin:14px 0 6px;color:var(--mute);font-size:.85rem}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.seat{padding:10px 0;text-align:center;border-radius:8px;border:1px solid var(--line);background:var(--free);color:var(--ink);font-weight:600}
.seat.taken{background:var(--taken);color:var(--mute);cursor:not-allowed;text-decoration:line-through}
.seat.mine{background:var(--mine);color:#2b2100;border-color:var(--mine)}
.seat.sel{outline:3px solid var(--acc);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mute);margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:.9rem}
th{color:var(--mute);font-weight:500}
.tag{padding:2px 8px;border-radius:99px;font-size:.78rem;background:var(--free)}
.tag.x{background:var(--taken);color:var(--mute)}
.msg{padding:10px 12px;border-radius:8px;margin-bottom:12px;background:var(--free)}
.msg.err{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.bar{height:10px;background:var(--taken);border-radius:5px;overflow:hidden;margin-top:4px}.bar>div{height:100%;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px}.stat b{font-size:1.5rem;display:block;font-family:"Newsreader",Georgia,serif}
.muted{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== STEP: paste your two Supabase values here (see setup steps) ===== */
const SUPABASE_URL="https://dtduofoyowxcuxcwpukc.supabase.co/rest/v1/";
const SUPABASE_KEY="sb_publishable_effOdF0OzgZfVO_WLeehAw_Lrbk8vjc";
/* ====================================================================== */
const configured=!SUPABASE_URL.startsWith("PASTE")&&typeof supabase!=="undefined";
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>fmt(new Date());
const D={seats:[],slots:[],res:[],students:[]};
const S={me:null,admin:false,tab:"book",mode:"login",date:today(),slot:null,sel:null,msg:null,err:false,busy:false};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slotOf=id=>D.slots.find(s=>s.id===id);
const active=()=>D.res.filter(r=>r.status==="active");
const taker=(seat,date,slot)=>active().find(r=>r.seat_id===seat&&r.res_date===date&&r.slot_id===slot);
function isPast(date,slot){const s=slotOf(slot);if(!s)return false;const t=today();if(date<t)return true;if(date>t)return false;return new Date().getHours()>=s.start_hour+2}
function flash(m,err){S.msg=m;S.err=!!err}
function fixSlot(){
 if(!D.slots.length)return;
 if(!slotOf(S.slot))S.slot=D.slots[0].id;
 if(!isPast(S.date,S.slot))return;
 const f=D.slots.find(s=>!isPast(S.date,s.id));
 if(f){S.slot=f.id;return}
 const d=new Date();d.setDate(d.getDate()+1);S.date=fmt(d);S.slot=D.slots[0].id;S.sel=null;
 if(S.me&&!S.admin&&!S.msg)S.msg="No slots left today, so tomorrow's seats are shown.";
}

/* ---------- database calls ---------- */
async function refresh(){
 const q=[sb.from("seats").select("*").order("id"),sb.from("time_slots").select("*").order("start_hour"),sb.from("reservations").select("*").order("res_date",{ascending:false})];
 if(S.admin)q.push(sb.from("students").select("*").order("name"));
 const r=await Promise.all(q);
 const bad=r.find(x=>x.error);
 if(bad){flash("Could not load data: "+bad.error.message,1);return}
 D.seats=r[0].data;D.slots=r[1].data;D.res=r[2].data;if(S.admin)D.students=r[3].data;
}
async function loadMe(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return;
 const {data:p}=await sb.from("students").select("*").eq("id",session.user.id).maybeSingle();
 if(!p){await sb.auth.signOut();flash("No student profile found for this account. It may have been removed by the admin.",1);return}
 S.me=p;S.admin=!!p.is_admin;S.tab=S.admin?"seatsA":"book";
 await refresh();
}
async function register(){
 const n=val("nm"),sid=val("sid"),em=val("em"),p=document.getElementById("p").value;
 if(!n||!sid||!em||p.length<6)return flash("Enter your name, student ID, email and a password of at least 6 characters.",1);
 const t=await sb.rpc("id_taken",{sid});
 if(t.data)return flash("That student ID is already registered. Log in instead.",1);
 const {data,error}=await sb.auth.signUp({email:em,password:p});
 if(error)return flash(error.message,1);
 if(!data.session)return flash("Account created, but Supabase is asking for email confirmation. Turn off \"Confirm email\" in Supabase (setup step 3) and register again.",1);
 const ins=await sb.from("students").insert({id:data.user.id,name:n,student_id:sid});
 if(ins.error)return flash("Could not save your profile: "+ins.error.message,1);
 await loadMe();
}
async function login(){
 const {error}=await sb.auth.signInWithPassword({email:val("em"),password:document.getElementById("p").value});
 if(error)return flash("Email or password is incorrect.",1);
 await loadMe();
}
async function book(){
 if(!S.sel)return flash("Pick a seat first.",1);
 if(isPast(S.date,S.slot))return flash("That time slot has already ended.",1);
 if(active().some(r=>r.student_id===S.me.id&&r.res_date===S.date&&r.slot_id===S.slot))return flash("You already have a seat for this time slot.",1);
 const {error}=await sb.from("reservations").insert({student_id:S.me.id,seat_id:S.sel,res_date:S.date,slot_id:S.slot});
 if(error){flash(error.code==="23505"?"That seat was just taken, or you already have a seat for this slot. Pick another.":error.message,1);return}
 const seat=D.seats.find(x=>x.id===S.sel);S.sel=null;
 flash("Booked seat "+seat.label+" on "+S.date+", "+slotOf(S.slot).label+".");
}
async function cancelRes(id){
 const {error}=await sb.from("reservations").update({status:"cancelled"}).eq("id",id);
 flash(error?error.message:"Reservation cancelled.",!!error);
}
async function addSeat(){
 const l=val("nl"),z=val("nz")||"Reading hall";
 if(!l)return flash("Enter a seat label.",1);
 const {error}=await sb.from("seats").insert({label:l,zone:z});
 flash(error?(error.code==="23505"?"A seat with that label already exists.":error.message):"Seat "+l+" added.",!!error);
}
async function delSeat(id){
 if(active().some(r=>r.seat_id===id&&!isPast(r.res_date,r.slot_id)))return flash("This seat has upcoming reservations. Cancel them first.",1);
 const {error}=await sb.from("seats").delete().eq("id",id);
 flash(error?error.message:"Seat removed.",!!error);
}
async function delStudent(id){
 const {error}=await sb.from("students").delete().eq("id",id);
 flash(error?error.message:"Student removed along with their reservations.",!!error);
}

/* ---------- views ---------- */
function seatGrid(){
 const zones=[...new Set(D.seats.map(s=>s.zone))];
 return zones.map(z=>`<div class="zone">${esc(z)}</div><div class="seats">`+D.seats.filter(s=>s.zone===z).map(s=>{
  const t=taker(s.id,S.date,S.slot),mine=t&&t.student_id===S.me.id;
  return `<button class="seat ${mine?"mine":t?"taken":""} ${S.sel===s.id?"sel":""}" data-act="pick" data-id="${s.id}" ${t?"disabled":""} aria-label="Seat ${esc(s.label)} ${mine?"booked by you":t?"taken":"free"}">${esc(s.label)}</button>`}).join("")+`</div>`).join("");
}
function bookView(){
 const free=D.seats.filter(s=>!taker(s.id,S.date,S.slot)).length;
 const sel=D.seats.find(x=>x.id===S.sel);
 return `<div class="card"><h2>Find a seat</h2>
 <div class="row"><div><label for="d">Date</label><input id="d" type="date" min="${today()}" value="${S.date}" data-act="date"></div>
 <div><label for="sl">Time slot</label><select id="sl" data-act="slot">${D.slots.map(s=>`<option value="${s.id}" ${s.id===S.slot?"selected":""} ${isPast(S.date,s.id)?"disabled":""}>${s.label}</option>`).join("")}</select></div></div>
 <p class="muted">${free} of ${D.seats.length} seats free for this slot.</p>
 <div class="legend"><span><i style="background:var(--free)"></i>Free</span><span><i style="background:var(--taken)"></i>Taken</span><span><i style="background:var(--mine)"></i>Yours</span></div>
 ${seatGrid()}
 <p><button data-act="book" ${sel?"":"disabled"}>${sel?"Reserve seat "+esc(sel.label):"Reserve seat"}</button></p></div>`;
}
function resTable(list,admin){
 if(!list.length)return `<p class="muted">No reservations yet.</p>`;
 return `<div class="scroll"><table><tr>${admin?"<th>Student</th>":""}<th>Seat</th><th>Date</th><th>Time</th><th>Status</th><th></th></tr>`+list.map(r=>{
  const seat=D.seats.find(s=>s.id===r.seat_id),st=D.students.find(s=>s.id===r.student_id),sl=slotOf(r.slot_id);
  const can=r.status==="active"&&!isPast(r.res_date,r.slot_id);
  return `<tr>${admin?`<td>${st?esc(st.name):"(removed)"}</td>`:""}<td>${seat?esc(seat.label):"(removed)"}</td><td>${r.res_date}</td><td>${sl?sl.label:""}</td><td><span class="tag ${r.status==="active"?"":"x"}">${r.status}</span></td><td>${can?`<button class="danger" data-act="cancel" data-id="${r.id}">Cancel</button>`:""}</td></tr>`}).join("")+`</table></div>`;
}
const byDate=l=>l.slice().sort((a,b)=>(b.res_date+b.slot_id).localeCompare(a.res_date+a.slot_id));
function mineView(){
 const mine=D.res.filter(r=>r.student_id===S.me.id);
 const up=mine.filter(r=>r.status==="active"&&!isPast(r.res_date,r.slot_id));
 return `<div class="card"><h2>Upcoming</h2>${resTable(byDate(up),false)}</div><div class="card"><h2>History</h2>${resTable(byDate(mine),false)}</div>`;
}
function reportView(){
 const all=D.res,a=active();
 const perSeat=D.seats.map(s=>({s,n:a.filter(r=>r.seat_id===s.id).length})).sort((x,y)=>y.n-x.n);
 const mx=Math.max(1,...perSeat.map(x=>x.n));
 return `<div class="card"><h2>Report</h2><div class="stats">
 <div class="stat"><b>${all.length}</b>Total bookings</div><div class="stat"><b>${a.length}</b>Active</div>
 <div class="stat"><b>${all.length-a.length}</b>Cancelled</div><div class="stat"><b>${a.filter(r=>r.res_date===today()).length}</b>Booked today</div></div>
 <h3>Bookings by time slot</h3>${D.slots.map(sl=>{const n=a.filter(r=>r.slot_id===sl.id).length;return `<div>${sl.label} <span class="muted">(${n})</span><div class="bar"><div style="width:${a.length?n/a.length*100:0}%"></div></div></div>`}).join("")}
 <h3 style="margin-top:16px">Most used seats</h3>${perSeat.slice(0,8).map(x=>`<div>${esc(x.s.label)} <span class="muted">(${x.n})</span><div class="bar"><div style="width:${x.n/mx*100}%"></div></div></div>`).join("")}</div>`;
}
function seatsAdmin(){
 return `<div class="card"><h2>Add a seat</h2><div class="row"><div><label for="nl">Seat label</label><input id="nl" placeholder="E1"></div><div><label for="nz">Zone</label><input id="nz" value="Reading hall"></div><div><button data-act="addseat">Add seat</button></div></div></div>
 <div class="card"><h2>Seats (${D.seats.length})</h2><div class="scroll"><table><tr><th>Seat</th><th>Zone</th><th></th></tr>`+D.seats.map(s=>`<tr><td>${esc(s.label)}</td><td>${esc(s.zone)}</td><td><button class="danger" data-act="delseat" data-id="${s.id}">Remove</button></td></tr>`).join("")+`</table></div></div>`;
}
function studentsAdmin(){
 const l=D.students.filter(s=>!s.is_admin);
 return `<div class="card"><h2>Students (${l.length})</h2>`+(l.length?`<div class="scroll"><table><tr><th>Name</th><th>Student ID</th><th></th></tr>`+l.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.student_id)}</td><td><button class="danger" data-act="delstu" data-id="${s.id}">Remove</button></td></tr>`).join("")+`</table></div>`:`<p class="muted">No students have registered yet.</p>`)+`</div>`;
}
function authView(){
 const reg=S.mode==="reg";
 return `<div class="card" style="max-width:420px;margin:8vh auto 0"><h1>Library Seat Reservation</h1><p class="muted">Reserve a seat before you walk in.</p>
 ${configured?"":`<div class="msg err">Database not connected yet. Open index.html and paste your Supabase URL and key at the top of the script.</div>`}
 <div class="tabs"><button class="${reg?"":"on"}" data-act="mode" data-id="login">Log in</button><button class="${reg?"on":""}" data-act="mode" data-id="reg">Register</button></div>
 ${reg?`<label for="nm">Full name</label><input id="nm" autocomplete="name"><label for="sid">Student ID</label><input id="sid">`:""}
 <label for="em">Email</label><input id="em" type="email" autocomplete="email">
 <label for="p">Password</label><input id="p" type="password" autocomplete="${reg?"new-password":"current-password"}">
 <p><button data-act="${reg?"register":"login"}" ${configured?"":"disabled"}>${reg?"Create account":"Log in"}</button></p></div>`;
}
function render(){
 fixSlot();
 const keep=document.activeElement&&document.activeElement.id;
 let h="";
 const note=S.msg?`<div class="msg ${S.err?"err":""}" role="status">${esc(S.msg)}</div>`:"";
 if(!S.me)h=note+authView();
 else{
  const tabs=S.admin?[["seatsA","Seats"],["resA","Reservations"],["stuA","Students"],["rep","Report"]]:[["book","Book a seat"],["mine","My reservations"]];
  if(!tabs.some(t=>t[0]===S.tab))S.tab=tabs[0][0];
  h=`<header><div><h1>Library Seat Reservation</h1><span class="muted">${S.admin?"Administrator":"Signed in as "+esc(S.me.name)+" ("+esc(S.me.student_id)+")"}</span></div><button class="ghost" data-act="logout">Log out</button></header>
  <div class="tabs">${tabs.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join("")}</div>${note}`;
  h+=S.tab==="book"?bookView():S.tab==="mine"?mineView():S.tab==="seatsA"?seatsAdmin():S.tab==="resA"?`<div class="card"><h2>All reservations</h2>${resTable(byDate(D.res),true)}</div>`:S.tab==="stuA"?studentsAdmin():reportView();
 }
 document.getElementById("app").innerHTML=h;
 S.msg=null;
 if(keep){const e=document.getElementById(keep);if(e&&e.tagName==="INPUT"&&e.type!=="date")e.focus()}
}
const val=id=>(document.getElementById(id)||{value:""}).value.trim();

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-act]");
 if(!b||b.tagName==="INPUT"||b.tagName==="SELECT"||S.busy||!sb)return;
 const a=b.dataset.act,id=b.dataset.id;
 S.busy=true;
 try{
  if(a==="pick")S.sel=S.sel===+id?null:+id;
  else if(a==="book"){await book();await refresh()}
  else if(a==="cancel"){await cancelRes(+id);await refresh()}
  else if(a==="tab"){S.tab=id;S.sel=null;await refresh()}
  else if(a==="mode")S.mode=id;
  else if(a==="logout"){await sb.auth.signOut();S.me=null;S.admin=false;S.sel=null;S.mode="login"}
  else if(a==="register")await register();
  else if(a==="login")await login();
  else if(a==="addseat"){await addSeat();await refresh()}
  else if(a==="delseat"){await delSeat(+id);await refresh()}
  else if(a==="delstu"){await delStudent(id);await refresh()}
 }catch(err){flash("Something went wrong: "+err.message,1)}
 S.busy=false;render();
});
document.addEventListener("change",async e=>{
 const a=e.target.dataset.act;if(!sb)return;
 if(a==="date"){S.date=e.target.value||today();S.sel=null;await refresh();render()}
 if(a==="slot"){S.slot=e.target.value;S.sel=null;await refresh();render()}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&e.target.tagName==="INPUT"&&!S.me){const go=document.querySelector('[data-act="login"],[data-act="register"]');if(go)go.click()}
});
render();
if(sb)loadMe().then(render);
</script>
</body>
</html>
